name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kotlin:
    name: Kotlin Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint Kotlin (ktlint)
        run: ./gradlew ktlintCheck

      - name: Build and Test
        run: ./gradlew build

      - name: Generate coverage report
        if: always()
        run: ./gradlew koverXmlReport

      - name: Upload Kover coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: build/reports/kover/report.xml
          flags: kotlin
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-test-results
          path: server/*/build/reports/tests/

  go:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Generate embedded version
        working-directory: cli
        run: go generate ./...

      - name: Build
        working-directory: cli
        run: go build ./...

      - name: Test
        working-directory: cli
        run: go test -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: cli

  e2e:
    name: CLI E2E (golden)
    runs-on: ubuntu-latest
    needs: [kotlin, go]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build server JAR
        run: ./gradlew :server:app:shadowJar

      - name: Generate embedded version
        working-directory: cli
        run: go generate ./...

      - name: Run e2e golden suite
        working-directory: cli
        env:
          CODELENS_SERVER_JAR: ${{ github.workspace }}/server/app/build/libs/codelens-server-all.jar
        run: go test -v -run TestE2E ./test/e2e/...

  # Aggregate gate consumed by the release-workflows convention: /release-workflows:release
  # (step 3) and release.yaml's ci-gate both query check_name=ci-success on the tagged
  # commit. This job fans up green only after every CI job above succeeds, exposing a
  # single required-check name for branch protection / the release skill to gate on.
  ci-success:
    # The check-run name MUST be exactly "ci-success" — the release-workflows
    # convention's /release-workflows:release (step 3) and release.yaml's
    # ci-gate query check_name=ci-success (exact server-side match). A label
    # like "ci-success (aggregate gate)" would not match and the release skill
    # would stall at its step-3 gate. Don't rename.
    name: ci-success
    runs-on: ubuntu-latest
    needs: [kotlin, go, e2e]
    if: always()
    steps:
      - name: Report aggregate result
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for r in $(echo "$RESULTS" | jq -r '.[]'); do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed (got: $r). ci-success is not green."
              exit 1
            fi
          done
          echo "ci-success green."

  # Validate the GoReleaser pipeline (including the nfpms: deb block + the bundled
  # server JAR) without publishing anything. Catches broken nfpm config before it
  # hits a real tag. Mirrors prox's release-snapshot job, adapted to build the JAR
  # first (codelens is a Gradle+Go hybrid, not pure Go like prox).
  release-snapshot:
    name: GoReleaser snapshot (deb validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build server JAR
        run: ./gradlew :server:app:shadowJar

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,announce,sign

      - name: Validate the deb artifacts
        run: |
          set -e
          for arch in amd64 arm64; do
            deb=$(ls dist/codelens_*_${arch}.deb 2>/dev/null | head -1)
            [ -n "$deb" ] || { echo "no $arch deb produced"; ls -la dist/; exit 1; }
            echo "=== validating $deb ==="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            dpkg-deb --field "$deb" Package | grep -qx 'codelens'
            dpkg-deb --field "$deb" Architecture | grep -qx "$arch"
            # Binary + bundled server JAR must land at the paths jar.go discovery expects.
            dpkg-deb --contents "$deb" | grep -q ' \./usr/local/bin/codelens$'
            dpkg-deb --contents "$deb" | grep -q ' \./usr/local/libexec/codelens-server-all.jar$'
          done
