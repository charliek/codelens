name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kotlin:
    name: Kotlin Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint Kotlin (ktlint)
        run: ./gradlew ktlintCheck

      - name: Build and Test
        run: ./gradlew build

      - name: Generate coverage report
        if: always()
        run: ./gradlew koverXmlReport

      - name: Upload Kover coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: build/reports/kover/report.xml
          flags: kotlin
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-test-results
          path: server/*/build/reports/tests/

  go:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Generate embedded version
        working-directory: cli
        run: go generate ./...

      - name: Build
        working-directory: cli
        run: go build ./...

      - name: Test
        working-directory: cli
        run: go test -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: cli

  e2e:
    name: CLI E2E (golden)
    runs-on: ubuntu-latest
    needs: [kotlin, go]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build server JAR
        run: ./gradlew :server:app:shadowJar

      - name: Generate embedded version
        working-directory: cli
        run: go generate ./...

      - name: Run e2e golden suite
        working-directory: cli
        env:
          CODELENS_SERVER_JAR: ${{ github.workspace }}/server/app/build/libs/codelens-server-all.jar
        run: go test -v -run TestE2E ./test/e2e/...
