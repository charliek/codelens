name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Set version from tag
        # Ephemeral rewrite so the build tree (server JAR + embedded Go version)
        # matches the tag. The committed, installer-facing version is reconciled on
        # main by the sync-version job below.
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build server JAR
        run: ./gradlew :server:app:shadowJar

      - name: Generate embedded version
        working-directory: cli
        run: go generate ./...

      - name: Run Go tests
        working-directory: cli
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          # --skip=validate tolerates the intentional version.txt rewrite above
          # (GoReleaser otherwise aborts on a "dirty" tree).
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  sync-version:
    name: Commit version to main
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          # Don't leave the token in git config; the push step below uses an
          # explicit tokenized URL instead.
          persist-credentials: false

      - name: Set version from tag
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Commit and push if the version files drifted
        # Keeps the committed version.txt and .claude-plugin/plugin.json in lockstep
        # with the released tag (Claude Code reads plugin.json from main, not from a
        # build artifact). Idempotent: a no-op when they already match, e.g. when the
        # bump was made by hand before tagging. The GITHUB_TOKEN push does not
        # re-trigger build.yml (GitHub blocks recursive workflow runs).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain version.txt .claude-plugin/plugin.json)" ]; then
            echo "version files already match ${GITHUB_REF_NAME}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt .claude-plugin/plugin.json
          git commit -m "chore: set version ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
