name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize re-runs against the same tag — better to wait than to abort
# half-uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to publish a release whose code didn't pass CI. Polls the aggregate
  # 'ci-success' check on the tagged commit (produced by build.yml's ci-success
  # job). The check name MUST stay exactly 'ci-success' — it is also queried by
  # /release-workflows:release; renaming either side silently breaks this gate.
  # Modeled on charliek/strix's release.yml ci-gate. Note: if a tag points at a
  # commit that never ran build.yml, no ci-success check exists and this waits
  # out the 45-min deadline then fails (deliberate — failing fast on an empty
  # result would misfire while build.yml is still starting on a fresh push).
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require ci-success green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 2700 ))   # 45 min; releases aren't time-sensitive
          while :; do
            latest="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=ci-success" \
              --jq '.check_runs | sort_by(.started_at) | last')"
            status="$(echo "${latest}" | jq -r '.status // "missing"')"
            conclusion="$(echo "${latest}" | jq -r '.conclusion // ""')"
            echo "ci-success @ ${GITHUB_SHA}: status=${status} conclusion=${conclusion}"
            if [ "${status}" = "completed" ]; then
              [ "${conclusion}" = "success" ] && { echo "CI green — releasing."; exit 0; }
              echo "::error::ci-success concluded '${conclusion}' for ${GITHUB_SHA} — not releasing."
              exit 1
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::timed out waiting for ci-success on ${GITHUB_SHA} (status=${status}). Push to main and let CI finish before tagging."
              exit 1
            fi
            sleep 20
          done

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [ci-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      # Tag/manifest invariant — the local-bump flow's safety net.
      # Replaces the deleted sync-version job's contract: if the tagged
      # commit's version.txt or .claude-plugin/plugin.json doesn't match
      # the tag, fail the release before any artifacts ship. The maintainer
      # re-runs /release-workflows:release against a corrected tag rather
      # than shipping mismatched bytes.
      - name: Verify version files match tag
        run: |
          set -euo pipefail
          expect="${GITHUB_REF_NAME#v}"
          got_txt="$(cat version.txt)"
          # Use jq to anchor to the top-level .version field rather than a
          # regex that could match nested "version" fields (e.g. in a future
          # "dependencies" or "repositories" block). jq is preinstalled on
          # ubuntu-latest runners and fails loudly on malformed JSON.
          got_json="$(jq -r '.version' .claude-plugin/plugin.json)"
          fail=0
          if [ "${got_txt}" != "${expect}" ]; then
            echo "::error::version.txt=${got_txt} != tag=${expect}"
            fail=1
          fi
          if [ "${got_json}" != "${expect}" ]; then
            echo "::error::plugin.json .version=${got_json} != tag=${expect}"
            fail=1
          fi
          [ "${fail}" -eq 0 ] || { echo "Re-run /release-workflows:release after correcting."; exit 1; }

      - name: Build server JAR
        run: ./gradlew :server:app:shadowJar

      - name: Generate embedded version
        working-directory: cli
        run: go generate ./...

      - name: Run Go tests
        working-directory: cli
        run: go test ./...

      # Mint a release-bot App token scoped to charliek/homebrew-tap for
      # GoReleaser's `brews:` step (formula push). The App must be
      # installed on homebrew-tap (verify via sanity-check-app.yml).
      # Replaces the legacy HOMEBREW_TAP_TOKEN PAT — GoReleaser is
      # token-source-agnostic; it just uses HOMEBREW_TAP_TOKEN from the
      # env for git authentication.
      - name: Mint a homebrew-tap App token
        id: tap
        uses: actions/create-github-app-token@v3
        with:
          client-id:      ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: homebrew-tap
          # Defense-in-depth: explicit permission floor on the minted
          # token so a future widening of the App's installation perms
          # doesn't silently broaden what this token can do. GoReleaser
          # only needs contents:write on the tap (to push the formula).
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          # No --skip=validate: the local-bump flow keeps the tree clean
          # (version.txt and plugin.json are bumped before the tag, so the
          # workflow doesn't rewrite tracked files; `go generate` writes to
          # cli/internal/version/version.txt which is gitignored).
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser reads HOMEBREW_TAP_TOKEN from this env var (see
          # .goreleaser.yaml: brews[].repository.token). Feed it the
          # App-minted token instead of a PAT.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}

  # apt-dispatch: notify apt-charliek to pick up the newly-published .debs and
  # republish its apt metadata. Pasted from cc-plugins release-workflows
  # references/workflows/job-apt-dispatch.yml (placeholders filled). Uses the
  # release-bot App — the same App/credentials as the homebrew-tap mint above —
  # scoped to apt-charliek alone. Skips on prereleases and if RELEASE_BOT_CLIENT_ID
  # is unset (apt-charliek's publish self-heals on its next dispatch in either case).
  apt-dispatch:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to dispatch
        id: guard
        env:
          CLIENT_ID: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            *-*)
              echo "::notice::${tag} is a prerelease — skipping charliek/apt-charliek dispatch."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ -z "${CLIENT_ID}" ]; then
            echo "::warning::RELEASE_BOT_CLIENT_ID not set — skipping dispatch. charliek/apt-charliek can self-heal on its next scheduled re-scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint an apt-charliek token
        if: steps.guard.outputs.skip == 'false'
        id: apt
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: apt-charliek
          # Defense-in-depth: POST /repos/.../dispatches needs contents:write;
          # pinning the floor avoids silent widening if the App's install perms
          # are ever expanded.
          permission-contents: write

      - name: Dispatch apt-charliek publish
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.apt.outputs.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh api "repos/charliek/apt-charliek/dispatches" --method POST \
            -f event_type=publish \
            -F "client_payload[package]=codelens" \
            -F "client_payload[tag]=${tag}"
          echo "::notice::Dispatched charliek/apt-charliek publish for codelens ${tag}."

# The earlier sync-version job that ran scripts/set-version.sh in CI and
# pushed the bumped version.txt + .claude-plugin/plugin.json back to main
# is removed. Version-file bumping is now LOCAL via
# scripts/release/update-version.sh (the cc-plugins:release-workflows
# convention's source-tree-bump-local rule). The release skill runs
# update-version.sh before tagging, so main always has both files at the
# released tag's version before the workflow even fires.
