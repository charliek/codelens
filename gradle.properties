# Gradle build properties

# JVM memory settings for Gradle builds
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Enable Gradle build cache
org.gradle.caching=true

# Use SDKMAN-managed Java
org.gradle.java.home=/root/.sdkman/candidates/java/current

# Proxy settings for Claude Code remote environment (via gradle-cc-proxy)
systemProp.http.proxyHost=localhost
systemProp.http.proxyPort=8899
systemProp.https.proxyHost=localhost
systemProp.https.proxyPort=8899
